<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#040402">
<title>Our Time</title>
<style>

/* ─── tokens ─── */
:root {
  --bg:   #040402;
  --txt:  #ece8dc;
  --gold: #cc9f3e;
  --dim:  rgba(236,232,220,0.32);
  --faint:rgba(236,232,220,0.12);
  --pad:  clamp(20px,7vw,80px);
  --sat:  env(safe-area-inset-top,0px);
  --sab:  env(safe-area-inset-bottom,0px);
}

/* ─── reset ─── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--bg)}
body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",sans-serif;
  -webkit-font-smoothing:antialiased;
  color:var(--txt);
  user-select:none;
  -webkit-tap-highlight-color:transparent;
}

/* ─── grain overlay ─── */
.grain{
  position:fixed;inset:0;z-index:900;
  width:100%;height:100%;
  pointer-events:none;opacity:.042;
  mix-blend-mode:overlay;
}

/* ─── curtain cut ─── */
.curtain{
  position:fixed;inset:0;z-index:800;
  background:var(--bg);
  opacity:0;pointer-events:none;
  transition:opacity .13s ease;
}
.curtain.on{opacity:1}

/* ─── scenes ─── */
.scene{
  position:fixed;inset:0;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  padding:calc(var(--sat)+52px) var(--pad) calc(var(--sab)+52px);
  opacity:0;pointer-events:none;
  cursor:pointer;touch-action:manipulation;
  will-change:opacity;
}
.scene.active{opacity:1;pointer-events:auto}

/* ─── tap hint ─── */
.tap-hint{
  position:absolute;
  bottom:calc(var(--sab) + 32px);
  left:50%;transform:translateX(-50%);
  font-size:.62rem;font-weight:600;
  letter-spacing:.26em;text-transform:uppercase;
  color:var(--dim);white-space:nowrap;
  display:flex;align-items:center;gap:8px;
  opacity:0;pointer-events:none;
  transition:opacity .6s ease;
}
.tap-hint.show{
  opacity:1;
  animation:breathe 2.4s ease-in-out infinite;
}
.tap-hint::before,.tap-hint::after{
  content:'';width:16px;height:1px;
  background:linear-gradient(90deg,transparent,rgba(204,159,62,.4));
}
.tap-hint::after{
  background:linear-gradient(90deg,rgba(204,159,62,.4),transparent);
}
@keyframes breathe{0%,100%{opacity:.35;transform:translateX(-50%) translateY(0)}50%{opacity:.9;transform:translateX(-50%) translateY(-2px)}}


/* ══════════════════════════════════════
   SCENE 1 — THE NUMBER
══════════════════════════════════════ */
.s1-inner{
  text-align:center;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
}

.s1-kicker{
  font-size:clamp(.62rem,1.6vw,.78rem);
  font-weight:600;letter-spacing:.26em;text-transform:uppercase;
  color:var(--gold);margin-bottom:clamp(32px,6vw,56px);
}

/* digit container */
.s1-num{
  font-size:clamp(5rem,24vw,19rem);
  font-weight:100;line-height:.84;
  letter-spacing:-.04em;font-variant-numeric:tabular-nums;
  color:var(--txt);
  text-shadow:0 0 140px rgba(204,159,62,.18);
}
.s1-digit{display:inline-block;transition:color .08s linear}
.s1-comma{display:inline-block;color:rgba(236,232,220,.18)}

/* when a digit locks in: flash gold → white */
@keyframes lock-flash{
  0%  {color:var(--gold);text-shadow:0 0 50px rgba(204,159,62,.95)}
  100%{color:var(--txt); text-shadow:0 0 140px rgba(204,159,62,.18)}
}
.s1-digit.locked{animation:lock-flash .55s ease forwards}

.s1-unit{
  margin-top:clamp(14px,2.2vw,24px);
  font-size:clamp(.62rem,1.6vw,.78rem);
  font-weight:600;letter-spacing:.36em;text-transform:uppercase;
  color:var(--dim);
}


/* ══════════════════════════════════════
   SCENE 2 — THE TIMELINE
══════════════════════════════════════ */
.s2-kicker{
  font-size:clamp(.62rem,1.6vw,.78rem);
  font-weight:600;letter-spacing:.26em;text-transform:uppercase;
  color:var(--gold);margin-bottom:clamp(48px,9vw,80px);
}

/* track area */
.tl-wrap{
  position:relative;
  width:min(92vw,920px);
  height:32px;
  display:flex;align-items:center;
}
.tl-bg{
  position:absolute;inset:0;
  height:2px;top:50%;transform:translateY(-50%);
  background:var(--faint);border-radius:2px;
}
.tl-fill{
  position:absolute;top:50%;left:0;
  height:3px;width:0%;
  transform:translateY(-50%);
  background:linear-gradient(90deg, rgba(204,159,62,.6), #f5d47a);
  border-radius:2px;
  box-shadow:0 0 20px 3px rgba(204,159,62,.75);
  transition:none;
  z-index:1;
}
/* glowing leading edge */
.tl-fill::after{
  content:'';
  position:absolute;right:-7px;top:50%;
  width:14px;height:14px;border-radius:50%;
  background:#fff5db;
  transform:translateY(-50%);
  box-shadow:0 0 22px 8px rgba(245,212,122,.9), 0 0 40px 14px rgba(204,159,62,.4);
  animation:orb 1.4s ease-in-out infinite;
}
@keyframes orb{0%,100%{box-shadow:0 0 20px 7px rgba(245,212,122,.95)}50%{box-shadow:0 0 34px 14px rgba(204,159,62,.45)}}

/* milestone dot (zero-size anchor, positioned via left%) */
.tl-dot{
  position:absolute;top:50%;
  width:0;height:0;
  z-index:2;
}
.tl-dot-inner{
  position:absolute;
  width:13px;height:13px;border-radius:50%;
  background:var(--bg);border:2px solid var(--gold);
  box-shadow:0 0 10px 2px rgba(204,159,62,.4);
  top:-6.5px;left:-6.5px;
  scale:0;
  transition:scale .55s cubic-bezier(.34,1.56,.64,1), border-color .3s, box-shadow .3s;
}
.tl-dot-inner.on{scale:1}

/* Highlighted Special Milestones */
.tl-dot.hl .tl-dot-inner{
  width:17px;height:17px;
  top:-8.5px;left:-8.5px;
  background:#ffe9aa;border:2.5px solid #fff;
  box-shadow:0 0 24px 8px rgba(245,212,122,.9), 0 0 45px 16px rgba(204,159,62,.45);
}
.tl-dot.hl .tl-dot-inner.on{
  animation:pulse-hl 2s infinite ease-in-out;
}
@keyframes pulse-hl{
  0%,100%{transform:scale(1);box-shadow:0 0 20px 6px rgba(245,212,122,.9)}
  50%{transform:scale(1.2);box-shadow:0 0 32px 12px rgba(245,212,122,1),0 0 50px 20px rgba(204,159,62,.5)}
}

/* milestone label — appears below/above each dot */
.tl-dot-label{
  position:absolute;
  top:22px;
  left:50%;
  transform:translateX(-50%) translateY(8px);
  white-space:nowrap;text-align:center;
  opacity:0;
  transition:opacity .4s ease .1s, transform .4s cubic-bezier(.16,1,.3,1) .1s;
}
.tl-dot-label.on{
  opacity:1;
  transform:translateX(-50%) translateY(0);
}
/* alternate: odd/above */
.tl-dot.above .tl-dot-label{
  top:auto;bottom:22px;
  transform:translateX(-50%) translateY(-8px);
}
.tl-dot.above .tl-dot-label.on{
  transform:translateX(-50%) translateY(0);
}

.tl-dot-date{
  font-size:clamp(.68rem,1.4vw,.82rem);
  font-weight:700;letter-spacing:.06em;
  font-variant-numeric:tabular-nums;
  color:var(--gold);
}
.tl-dot-time{
  font-size:clamp(.58rem,1.1vw,.68rem);
  font-weight:500;letter-spacing:.04em;
  color:rgba(236,232,220,.5);
  margin-left:4px;
}
.tl-dot-name{
  margin-top:4px;
  font-size:clamp(.6rem,1.25vw,.74rem);
  font-weight:500;letter-spacing:.06em;
  color:var(--dim);
}

/* Highlighted labels */
.tl-dot.hl .tl-dot-date{
  color:#fff;
  text-shadow:0 0 16px rgba(245,212,122,.9);
  font-size:clamp(.74rem,1.5vw,.88rem);
}
.tl-dot.hl .tl-dot-name{
  color:#f7df99;
  font-weight:600;
  text-shadow:0 0 12px rgba(204,159,62,.6);
}
.tl-dot.hl .tl-badge{
  display:inline-block;
  background:linear-gradient(135deg, #c8685c, #cc9f3e);
  color:#fff;font-size:.52rem;font-weight:700;
  letter-spacing:.08em;text-transform:uppercase;
  padding:2px 6px;border-radius:4px;
  margin-bottom:3px;
  box-shadow:0 0 10px rgba(200,104,92,.6);
}

/* mobile: hide direct labels on dense screens, show active milestone bar */
@media(max-width:680px){
  .tl-dot-label{display:none}
  .tl-cur{display:flex}
}
@media(min-width:681px){
  .tl-cur{display:none}
}

/* current-label bar (mobile) */
.tl-cur{
  margin-top:36px;
  flex-direction:column;align-items:center;
  text-align:center;min-height:56px;
}
.tl-cur-date{
  font-size:.9rem;font-weight:700;letter-spacing:.08em;
  font-variant-numeric:tabular-nums;color:var(--gold);
  transition:opacity .25s,transform .25s cubic-bezier(.16,1,.3,1);
}
.tl-cur-name{
  font-size:.76rem;font-weight:500;letter-spacing:.06em;
  color:var(--dim);margin-top:6px;
  transition:opacity .25s,transform .25s cubic-bezier(.16,1,.3,1);
}
.tl-cur-badge{
  display:none;
  background:linear-gradient(135deg, #c8685c, #cc9f3e);
  color:#fff;font-size:.54rem;font-weight:700;
  letter-spacing:.08em;text-transform:uppercase;
  padding:2px 8px;border-radius:4px;margin-bottom:6px;
}
.tl-cur.hl .tl-cur-date{color:#fff;text-shadow:0 0 16px rgba(245,212,122,.9)}
.tl-cur.hl .tl-cur-name{color:#f7df99;font-weight:600}
.tl-cur.hl .tl-cur-badge{display:inline-block}
.tl-cur-date.fade,.tl-cur-name.fade{opacity:0;transform:translateY(4px)}


/* ══════════════════════════════════════
   SCENE 3 — THE CLOCK
══════════════════════════════════════ */
.s3-kicker{
  font-size:clamp(.58rem,1.5vw,.72rem);
  font-weight:600;letter-spacing:.22em;text-transform:uppercase;
  color:var(--gold);
  margin-bottom:clamp(28px,5vw,52px);
  text-align:center;
}

.clk{text-align:center}

.clk-days{
  display:flex;align-items:baseline;
  justify-content:center;gap:clamp(10px,2vw,18px);
  margin-bottom:clamp(14px,3vw,26px);
}
.clk-days-num{
  font-size:clamp(4.5rem,20vw,16rem);
  font-weight:100;line-height:.86;
  letter-spacing:-.04em;font-variant-numeric:tabular-nums;
  color:var(--txt);
  text-shadow:0 0 100px rgba(204,159,62,.12);
}
.clk-days-lbl{
  font-size:clamp(.6rem,1.8vw,.9rem);
  font-weight:500;letter-spacing:.22em;text-transform:uppercase;
  color:var(--dim);align-self:flex-end;margin-bottom:.15em;
}

.clk-hms{
  display:flex;align-items:baseline;
  justify-content:center;
}
.cs{text-align:center}
.cs-val{
  display:block;
  font-size:clamp(1.8rem,5.5vw,4.5rem);
  font-weight:200;font-variant-numeric:tabular-nums;
  letter-spacing:-.02em;
  color:rgba(236,232,220,.58);line-height:1;
}
.cs-lbl{
  display:block;margin-top:5px;
  font-size:clamp(.5rem,.9vw,.6rem);
  font-weight:700;letter-spacing:.18em;text-transform:uppercase;
  color:var(--dim);
}
.csep{
  font-size:clamp(1.5rem,4.5vw,3.5rem);
  font-weight:100;color:rgba(236,232,220,.1);
  padding:0 clamp(6px,1.2vw,12px);
  line-height:1;margin-bottom:clamp(14px,2.5vw,22px);
}

/* tick animation on seconds */
.cs-val.tick{animation:sec-tick .2s ease}
@keyframes sec-tick{
  0%  {color:var(--gold)}
  100%{color:rgba(236,232,220,.58)}
}

.clk-sub{
  margin-top:clamp(20px,4vw,36px);
  font-size:clamp(.54rem,1.1vw,.64rem);
  font-weight:600;letter-spacing:.18em;text-transform:uppercase;
  color:var(--dim);text-align:center;
}

/* ─── reduced motion ─── */
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{
    animation-duration:1ms!important;
    transition-duration:1ms!important;
    animation-iteration-count:1!important;
  }
}
</style>
</head>
<body>

<!-- grain -->
<svg class="grain" aria-hidden="true">
  <filter id="gf"><feTurbulence type="fractalNoise" baseFrequency=".65" numOctaves="3" stitchTiles="stitch"/>
  <feColorMatrix type="saturate" values="0"/></filter>
  <rect width="100%" height="100%" filter="url(#gf)" opacity=".35"/>
</svg>

<!-- cut curtain -->
<div class="curtain" id="curtain"></div>


<!-- ══ SCENE 1 ══ -->
<section class="scene active" id="s1" aria-label="Scene 1 of 3">
  <div class="s1-inner">
    <p class="s1-kicker">Together since June&nbsp;19,&nbsp;2018</p>
    <div class="s1-num" id="s1-num" aria-live="polite"></div>
    <p class="s1-unit">days</p>
  </div>
  <div class="tap-hint" id="s1-tap">Tap anywhere to continue</div>
</section>


<!-- ══ SCENE 2 ══ -->
<section class="scene" id="s2" aria-label="Scene 2 of 3">
  <p class="s2-kicker">Our journey</p>
  <div class="tl-wrap" id="tl-wrap">
    <div class="tl-bg"></div>
    <div class="tl-fill" id="tl-fill"></div>
    <!-- dots injected by JS -->
  </div>
  <!-- mobile: current label -->
  <div class="tl-cur" id="tl-cur">
    <div class="tl-cur-badge" id="tl-cur-badge">Special Moment</div>
    <div class="tl-cur-date" id="tl-cur-date"></div>
    <div class="tl-cur-name" id="tl-cur-name"></div>
  </div>
  <div class="tap-hint" id="s2-tap">Tap anywhere to continue</div>
</section>


<!-- ══ SCENE 3 ══ -->
<section class="scene" id="s3" aria-label="Scene 3 of 3">
  <p class="s3-kicker">Every second, since that moment.</p>
  <div class="clk">
    <div class="clk-days">
      <span class="clk-days-num" id="s3-d">0</span>
      <span class="clk-days-lbl">days</span>
    </div>
    <div class="clk-hms">
      <div class="cs"><span class="cs-val" id="s3-h">00</span><span class="cs-lbl">hrs</span></div>
      <span class="csep">:</span>
      <div class="cs"><span class="cs-val" id="s3-m">00</span><span class="cs-lbl">min</span></div>
      <span class="csep">:</span>
      <div class="cs"><span class="cs-val" id="s3-s">00</span><span class="cs-lbl">sec</span></div>
    </div>
  </div>
  <p class="clk-sub">Since June&nbsp;19,&nbsp;2018 · 7:00&nbsp;PM</p>
  <div class="tap-hint show">Tap to restart</div>
</section>


<script>
(function () {
  'use strict';

  /* ────────────────────────────────
     CONSTANTS
  ──────────────────────────────── */
  var LOVE_MIDNIGHT = new Date(2018, 5, 19, 0, 0, 0);   // for S1 day count
  var LOVE_MOMENT   = new Date(2018, 5, 19, 19, 0, 0);  // 7pm for S3 timer
  var DAY_MS = 86400000;
  var fmt    = new Intl.NumberFormat('en-US');
  var noMo   = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ────────────────────────────────
     SCENE MANAGEMENT
  ──────────────────────────────── */
  var scenes     = [s('s1'), s('s2'), s('s3')];
  var curtain    = s('curtain');
  var current    = 0;
  var locked     = false;
  var s2Done     = false;

  function s(id) { return document.getElementById(id); }

  function goNext() {
    if (locked) return;
    if (current === 1 && !s2Done) return; // block during S2 animation
    locked = true;
    curtain.classList.add('on');
    setTimeout(function () {
      scenes[current].classList.remove('active');
      current = (current + 1) % 3;
      scenes[current].classList.add('active');
      initScene(current);
      curtain.classList.remove('on');
      setTimeout(function () { locked = false; }, 380);
    }, 140);
  }

  document.addEventListener('click', goNext);
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' || e.key === ' ' || e.key === 'ArrowRight') {
      e.preventDefault(); goNext();
    }
  });

  function initScene(idx) {
    if (idx === 0) initS1();
    else if (idx === 1) initS2();
    else if (idx === 2) initS3();
  }

  /* ────────────────────────────────
     SCENE 1: DIGIT SCRAMBLE
  ──────────────────────────────── */
  var s1NumEl = s('s1-num');
  var s1Tap   = s('s1-tap');
  var s1Timers = [];

  function initS1() {
    s1Timers.forEach(function (t) { clearTimeout(t); clearInterval(t); });
    s1Timers = [];
    s1NumEl.innerHTML = '';
    if (s1Tap) s1Tap.classList.remove('show');

    var days      = Math.floor((Date.now() - LOVE_MIDNIGHT) / DAY_MS);
    var formatted = fmt.format(days);  // e.g. "2,986"
    var digitIdx  = 0;
    var maxLockTime = 0;

    formatted.split('').forEach(function (ch) {
      var span = document.createElement('span');

      if (ch === ',') {
        span.className   = 's1-comma';
        span.textContent = ',';
        s1NumEl.appendChild(span);
        return;
      }

      var di = digitIdx++;
      span.className   = 's1-digit';
      span.textContent = noMo ? ch : '0';
      s1NumEl.appendChild(span);

      if (noMo) return;

      var SCRAMBLE_START = di * 180;
      var LOCK_AT        = SCRAMBLE_START + 600;
      if (LOCK_AT > maxLockTime) maxLockTime = LOCK_AT;

      var iv = null;
      var t1 = setTimeout(function () {
        span.style.color = 'rgba(236,232,220,0.18)';
        iv = setInterval(function () {
          span.textContent = Math.floor(Math.random() * 10);
        }, 48);
        s1Timers.push(iv);
      }, SCRAMBLE_START);
      s1Timers.push(t1);

      var t2 = setTimeout(function () {
        if (iv) clearInterval(iv);
        span.textContent = ch;
        span.style.color = '';
        span.classList.remove('locked');
        void span.offsetWidth;
        span.classList.add('locked');
      }, LOCK_AT);
      s1Timers.push(t2);
    });

    // Reveal tap hint when number finishes scrambling
    var tHint = setTimeout(function () {
      if (s1Tap) s1Tap.classList.add('show');
    }, noMo ? 200 : maxLockTime + 400);
    s1Timers.push(tHint);
  }

  /* ────────────────────────────────
     SCENE 2: TIMELINE
  ──────────────────────────────── */
  var tlWrap    = s('tl-wrap');
  var tlFill    = s('tl-fill');
  var tlCur     = s('tl-cur');
  var tlCBadge  = s('tl-cur-badge');
  var tlCDate   = s('tl-cur-date');
  var tlCName   = s('tl-cur-name');
  var s2Tap     = s('s2-tap');

  var MILESTONES = [
    { pos: 0.00, date: '2018.06.19', time: '',      name: 'First meeting',            above: false, hl: false },
    { pos: 0.08, date: '2018.09.06', time: '11:40', name: 'First dating · 11:40 AM', above: true,  hl: true, badge: 'First Dating' },
    { pos: 0.16, date: '2018.09.06', time: '13:00', name: 'She said yes · 1:00 PM',  above: false, hl: true, badge: 'Together' },
    { pos: 0.38, date: '2020.12.06', time: '',      name: 'The proposal',             above: true,  hl: false },
    { pos: 0.48, date: '2021.07.09', time: '',      name: 'Marriage registration',    above: false, hl: false },
    { pos: 0.62, date: '2022.09.15', time: '',      name: 'Wedding day',              above: true,  hl: false },
    { pos: 0.98, date: 'Today',      time: '',      name: 'Still counting',           above: false, hl: false }
  ];

  var tlProgress  = 0;
  var tlNextIdx   = 0;
  var tlPausing   = false;
  var tlPauseEnd  = 0;
  var tlLastT     = 0;
  var tlRaf       = 0;
  var TL_SPEED    = 0.20;  // progress per second
  var TL_PAUSE_MS = 1350;

  function buildDots() {
    tlWrap.querySelectorAll('.tl-dot').forEach(function (d) { d.remove(); });

    MILESTONES.forEach(function (ms, i) {
      var anchor = document.createElement('div');
      anchor.className = 'tl-dot' + (ms.above ? ' above' : '') + (ms.hl ? ' hl' : '');
      anchor.id = 'tld-' + i;
      anchor.style.left = (ms.pos * 100).toFixed(1) + '%';

      var dot = document.createElement('div');
      dot.className = 'tl-dot-inner';
      dot.id = 'tli-' + i;

      var lbl = document.createElement('div');
      lbl.className = 'tl-dot-label';
      lbl.id = 'tll-' + i;

      if (ms.badge) {
        var bEl = document.createElement('div');
        bEl.className = 'tl-badge';
        bEl.textContent = ms.badge;
        lbl.appendChild(bEl);
      }

      var dEl = document.createElement('div');
      dEl.className = 'tl-dot-date';
      dEl.textContent = ms.date;
      if (ms.time) {
        var tSpan = document.createElement('span');
        tSpan.className = 'tl-dot-time';
        tSpan.textContent = ms.time;
        dEl.appendChild(tSpan);
      }

      var nEl = document.createElement('div');
      nEl.className = 'tl-dot-name';
      nEl.textContent = ms.name;

      lbl.appendChild(dEl);
      lbl.appendChild(nEl);
      anchor.appendChild(dot);
      anchor.appendChild(lbl);
      tlWrap.appendChild(anchor);
    });
  }

  function showMilestone(idx) {
    var dot = s('tli-' + idx);
    var lbl = s('tll-' + idx);
    if (dot) dot.classList.add('on');
    if (lbl) setTimeout(function () { lbl.classList.add('on'); }, 140);

    var ms = MILESTONES[idx];
    if (tlCur) {
      tlCDate.classList.add('fade');
      tlCName.classList.add('fade');
      setTimeout(function () {
        if (ms.hl) {
          tlCur.classList.add('hl');
          if (tlCBadge) tlCBadge.textContent = ms.badge || 'Special Moment';
        } else {
          tlCur.classList.remove('hl');
        }
        tlCDate.textContent = ms.date + (ms.time ? '  ' + ms.time : '');
        tlCName.textContent = ms.name;
        tlCDate.classList.remove('fade');
        tlCName.classList.remove('fade');
      }, 200);
    }
  }

  function tlTick(now) {
    var dt = Math.min((now - tlLastT) / 1000, 0.1);
    tlLastT = now;

    if (tlPausing) {
      if (now >= tlPauseEnd) {
        tlPausing  = false;
        tlNextIdx++;
      }
    } else if (tlNextIdx < MILESTONES.length) {
      var target = MILESTONES[tlNextIdx].pos;
      tlProgress  = Math.min(target, tlProgress + TL_SPEED * dt);
      tlFill.style.width = (tlProgress * 100).toFixed(2) + '%';

      if (tlProgress >= target) {
        showMilestone(tlNextIdx);
        if (tlNextIdx === MILESTONES.length - 1) {
          s2Done = true;
          tlFill.style.setProperty('box-shadow', '0 0 10px rgba(204,159,62,.4)');
          setTimeout(function () {
            if (s2Tap) s2Tap.classList.add('show');
          }, 500);
          return;
        }
        tlPausing  = true;
        // give highlighted moments a slightly longer pause for emphasis
        var pauseDuration = MILESTONES[tlNextIdx].hl ? TL_PAUSE_MS * 1.3 : TL_PAUSE_MS;
        tlPauseEnd = now + pauseDuration;
      }
    }

    tlRaf = requestAnimationFrame(tlTick);
  }

  function initS2() {
    cancelAnimationFrame(tlRaf);
    s2Done      = false;
    tlProgress  = 0;
    tlNextIdx   = 0;
    tlPausing   = false;
    tlFill.style.width = '0%';
    if (s2Tap) s2Tap.classList.remove('show');
    if (tlCur) {
      tlCur.classList.remove('hl');
      tlCDate.textContent = '';
      tlCName.textContent = '';
    }
    buildDots();

    setTimeout(function () {
      showMilestone(0);
      tlProgress = MILESTONES[0].pos;
      tlNextIdx  = 1;
      tlPausing  = true;
      tlPauseEnd = performance.now() + TL_PAUSE_MS;
      tlLastT    = performance.now();
      tlRaf      = requestAnimationFrame(tlTick);
    }, 380);
  }

  /* ────────────────────────────────
     SCENE 3: TIMER
  ──────────────────────────────── */
  var s3D    = s('s3-d');
  var s3H    = s('s3-h');
  var s3M    = s('s3-m');
  var s3Secs = s('s3-s');
  var s3Iv   = null;
  var prevSec = -1;

  function updateClock() {
    var el  = Math.max(0, Date.now() - LOVE_MOMENT);
    var d   = Math.floor(el / DAY_MS);
    var rem = el - d * DAY_MS;
    var h   = Math.floor(rem / 3600000);
    var m   = Math.floor((rem % 3600000) / 60000);
    var sec = Math.floor((rem % 60000) / 1000);

    s3D.textContent = fmt.format(d);
    s3H.textContent = pad2(h);
    s3M.textContent = pad2(m);
    s3Secs.textContent = pad2(sec);

    if (sec !== prevSec && !noMo) {
      prevSec = sec;
      s3Secs.classList.remove('tick');
      void s3Secs.offsetWidth;
      s3Secs.classList.add('tick');
    }
  }

  function pad2(n) { return String(n).padStart(2, '0'); }

  function initS3() {
    clearInterval(s3Iv);
    prevSec = -1;
    updateClock();
    s3Iv = setInterval(updateClock, 250);
  }

  /* ────────────────────────────────
     BOOT
  ──────────────────────────────── */
  initS1();

}());
</script>
